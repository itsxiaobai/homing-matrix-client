name: homing
description: "Homing：開源 Matrix 通訊軟體（繁中優先）。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.9+2102

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # 第七十批 c：Compound Icons（Element 官方設計系統，AGPL-3.0）SVG 渲染
  # SPDX：BSD-3-Clause（flutter_svg；記錄於 ../DEPENDENDENCIES.md 待辦）
  flutter_svg: ^2.2.0
  # 第七十批 d：語音訊息（錄音＋播放；錄音走官方 Room.sendFileEvent，加密房自動加密）
  record: ^6.1.2
  just_audio: ^0.9.41
  # 錄音權限請求（Android RECORD_AUDIO；manifest 已宣告）
  permission_handler: ^11.4.0
  # 第八十六批：無障礙服務（本機處理、不送雲端，保護隱私＋舊裝置可跑）
  # SPDX：flutter_tts (MIT) / speech_to_text (MIT) / google_mlkit_text_recognition (Apache-2.0)
  flutter_tts: ^4.2.0
  speech_to_text: ^7.3.0
  google_mlkit_text_recognition: ^0.15.0
  # 第九十二批：本機 Whisper STT（音檔／通話即時字幕；模型分開下載、
  # 離線處理不送雲端，保護隱私；Android API 24+ 舊裝置可跑）。
  # SPDX：MIT（whisper_ggml）；模型為 whisper.cpp GGML（MIT）。
  whisper_ggml: ^2.10.0

  # 第五十七批（人類 2026-11-17 批准）：Flutter **內建**元件的多語言
  # （日期選擇器、系統對話框等）→ 需官方 `flutter_localizations`。
  # `intl: any` 為官方建議寫法（避免與 flutter_localizations 鎖定的版本衝突）。
  # SPDX：BSD-3-Clause（flutter/packages）；見 ../DEPENDENCIES.md
  flutter_localizations:
    sdk: flutter
  intl: any

  # Matrix 客戶端 SDK（matrix-dart-sdk，famedly 維護）
  # SPDX-License-Identifier: AGPL-3.0-or-later（2026-10-31 於上游 pubspec.yaml 人工複核通過；記錄於 ../DEPENDENCIES.md）
  matrix: ^16.0.4

  # Android 12+ 系統取色（dynamic color）；fallback 為人類指定之品牌種子色（DESIGN.md §3）
  # SPDX：Apache-2.0（來源：material-foundation/flutter-packages；記錄於 ../DEPENDENCIES.md）
  # ↳ 固定 1.8.1：2.1.0 的 builder 簽名指向 material_ui 之私有 ColorScheme，與 flutter/material
  #   ColorScheme 型別不相容（2026-10-31 實測，升級前需人工重新評估並查證相容性）
  dynamic_color: 1.8.1

  # 以系統瀏覽器開啟 homeserver 的網頁註冊頁（1.3；人類批准 2026-10-31）
  # SPDX：BSD-3-Clause（來源：flutter/packages；記錄於 ../DEPENDENCIES.md）
  url_launcher: ^6.3.3

  # 1.4 前置：客戶端本地儲存（方案 C，人類批准 2026-10-31）
  # * sqflite：MatrixSdkDatabase 的行動端 SQLite 後端
  #   SPDX：BSD-2-Clause（tekartik/sqflite；記錄於 ../DEPENDENCIES.md）
  sqflite: ^2.4.5
  # * sqflite_common_ffi_web（第三十五批 #1，人類批准「官方依賴允許」）：Web 端
  #   本機資料庫（IndexedDB 後端；sqflite 同源生態，tekartik 維護）。
  #   SPDX：BSD-2-Clause（本機 pub-cache LICENSE 覆核 2026-11-12；記錄於
  #   ../DEPENDENCIES.md）
  sqflite_common_ffi_web: ^1.2.0
  # * markdown（第三十五批 #13，人類批准「官方依賴允許」）：送出端
  #   Markdown→HTML（Matrix 官方 formatted_body 格式）。Dart 官方套件。
  #   SPDX：BSD-3-Clause（記錄於 ../DEPENDENCIES.md）
  markdown: ^7.3.0
  # * flutter_secure_storage：access token／SSSS cache 存系統安全儲存
  #   SPDX：BSD-3-Clause（記錄於 ../DEPENDENCIES.md）
  flutter_secure_storage: ^11.2.0
  # EXIF 摘除（人類批准 2026-11-06 方案 C）：上傳前 isolate 內
  # decode→清 EXIF→copyResize→encodeJpg(quality 78)。matrix 已傳遞依賴
  # image ^4.0.15（lock 實際解析 4.12.0），此處僅直接化引用，非新增套件。
  # SPDX：MIT（brendan-duncan/image，pub-cache LICENSE 已核對）
  image: ^4.13.0
  # 貼圖包 zip 匯入（藍圖 Phase 3.2／3.3；人類批准 2026-11-14）：
  # zip 讀取與安全驗證（路徑穿越／解壓炸彈／格式白名單／檔頭預檢）。
  # **archive 4.6.0 已在依賴樹內**（image 的傳遞依賴）→ 升為直接依賴，
  # 不新增任何套件到 App；版本以 lock 解析為準（4.6.0）。
  # SPDX：MIT（brendan-duncan/archive；pub-cache LICENSE 已核對，見 DEPENDENCIES.md）
  archive: ^4.6.0
  # 本機貼圖庫資料夾（zip 貼圖包解壓副本，Phase 3.2）。
  # **path_provider 已在依賴樹內**（傳遞依賴）→ 升為直接依賴，不新增套件到 App。
  # SPDX：BSD-3-Clause（flutter/packages；見 DEPENDENCIES.md）
  path_provider: ^2.1.6
  # 1.8 加入好友/QR 解析 skeleton (mobile_scanner)
  # SPDX：BSD-3-Clause（mobile_scanner；記錄於 ../DEPENDENCIES.md）
  mobile_scanner: ^7.4.3

  # 2.8 照片/影片傳輸（人类批准 2026-10-31）：Android 系統檔案選取器（多選）
  # SPDX：MIT（miguelpruivo/vicajilau file_picker；pub.dev 查證日 2026-10-31）
  file_picker: ^13.3.0

  # UI 重構（依人類 LINE_ref 標註，批准 2026-11-01）：輸入列「相機」鈕
  # 拍照附件（ImageSource.camera 走系統相機 intent，App 端不自行處理相機）
  # SPDX：BSD-3-Clause（flutter/packages image_picker 系外掛；pub-cache
  #   LICENSE 已核對，查證日 2026-11-01 — 詳記錄於 ../DEPENDENCIES.md）
  image_picker: ^1.2.1

  # P2.15（人類批准依賴 2026-11-01）：一對一通話（音訊／視訊）
  # SDK 官方 VoIP 需 App 端提供 WebRTCDelegate 實作 → flutter_webrtc（MIT）
  # SPDX：MIT（flutter-webrtc/flutter-webrtc，GitHub LICENSE 查證日 2026-11-01）
  flutter_webrtc: ^1.6.3

  # P2.15c（人類批准 2026-11-01）：LiveKit-backed 群組通話（MatrixRTC，MSC4143）
  # 與 matrix 14.2.0 LiveKitBackend 橋接；E2EE 用 SDK 官方 keyProvider 機制
  # SPDX：Apache-2.0（livekit/client-sdk-flutter GitHub LICENSE 查證日 2026-11-01）
  livekit_client: ^2.8.1

  # 同上：SDK WebRTCDelegate 之型別來源（matrix 已 transitive；轉直接引用型別）
  # SPDX：MIT（webrtc_interface 1.5.1 LICENSE，pub-cache 查證日 2026-11-01）
  webrtc_interface: ^1.5.1

  # 1.5（人類批准 2026-10-31）：vodozemac（Rust）之 Flutter 原生綁定，
  # 提供 `libvodozemac_bindings_dart.so`；matrix 14.2.0 的加密引擎
  # （client.encryption）必須先 `vod.init()` 才會啟用（官方文件機制）。
  # SPDX：AGPL-3.0（famedly/dart-vodozemac；記錄於 ../DEPENDENCIES.md）
  flutter_vodozemac: ^0.9.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  pip: ^0.0.4
  wakelock_plus: ^1.8.2
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  open_file: ^4.0.0
  app_links: ^7.2.2
  # 任務 3 批次 A（人類批准 2026-11-07）：UnifiedPush 通道偵測／註冊
  # （Android 上偵測使用者自選的 distributor，如 ntfy）。
  # SPDX：Apache-2.0（unifiedpush-6.1.0 LICENSE 已核對 pub-cache）
  unifiedpush: ^6.1.0
  # FCM 推播（第四十一批，人類指示「FCM ＋ UnifiedPush 通知加入」）：
  # firebase_core＝Firebase 初始化；firebase_messaging＝token 取得與訊息監聽。
  # 兩者**皆為 Android 有效**；沒有 google-services.json 時 App 端自動停用 FCM
  # （見 lib/push/fcm_runtime.dart），退回 UnifiedPush／本機通知。
  # SPDX：BSD-3-Clause（flutter/packages；本機 pub-cache LICENSE 已核對 2026-11-15）
  firebase_core: ^5.1.0
  # SPDX：BSD-3-Clause（flutter/packages；本機 pub-cache LICENSE 已核對 2026-11-15）
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 僅整合測試用： 提供 sqlite3（FFI）資料庫工廠，供 Client 的 MatrixSdkDatabase 使用
  # （此期間 matrix 14.2.0 的 Client 建構子必須提供 Database；採 in-memory sqlite，不落檔）
  # 人類授權：2026-10-31（本專案 AGENTS.md「新增依賴須人工審核」已批准）
  sqflite_common_ffi: ^2.4.5

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # 第七十批 c：Compound Icons（Element 設計系統，AGPL-3.0）SVG assets
  assets:
    - assets/icons/compound/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
